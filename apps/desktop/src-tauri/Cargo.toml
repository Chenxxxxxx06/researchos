[package]
name = "researchos-desktop"
version = "0.1.0"
description = "ResearchOS desktop shell"
authors = ["Chenxxxxxx06"]
edition = "2021"
license = "Proprietary"

[lib]
name = "researchos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
