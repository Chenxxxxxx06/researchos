name: Release ResearchOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: researchos
          POSTGRES_PASSWORD: researchos
          POSTGRES_DB: researchos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag
        shell: bash
        run: |
          expected="v$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)"
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install and verify backend
        run: |
          python -m pip install uv build
          cd apps/api
          uv pip install --system -e ".[dev]"
          ruff check .
          mypy researchos
          pytest -q
        env:
          POSTGRES_DSN: postgresql+asyncpg://researchos:researchos@localhost:5432/researchos_test
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: release-ci-secret
          DB_USE_NULLPOOL: "true"
          WORKSPACE_ROOT: /tmp/ros-release-workspaces
      - uses: pnpm/action-setup@v6
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Verify frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm --filter web build
      - name: Build CLI/API package
        run: python -m build --outdir dist apps/api
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "ResearchOS $GITHUB_REF_NAME" \
            $prerelease

  desktop-windows:
    needs: verify-build-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate desktop source
        run: pnpm desktop:validate
      - name: Build Windows desktop bundles
        run: pnpm desktop:build
      - name: Upload Windows applications to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseRoot = "apps/desktop/src-tauri/target/release"
          $version = (Get-Content VERSION -Raw).Trim()
          $portablePath = Join-Path $releaseRoot "ResearchOS_${version}_x64-portable.exe"
          Copy-Item "$releaseRoot/researchos-desktop.exe" $portablePath -Force
          $files = @(
            Get-Item $portablePath -ErrorAction SilentlyContinue
            Get-ChildItem "$releaseRoot/bundle/msi/*.msi" -ErrorAction SilentlyContinue
            Get-ChildItem "$releaseRoot/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue
          ) | Where-Object { $_ }
          if ($files.Count -lt 2) {
            throw "Expected a portable executable and at least one Windows installer."
          }
          $checksumPath = Join-Path $releaseRoot "SHA256SUMS-DESKTOP.txt"
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content $checksumPath
          $uploadPaths = @($files.FullName) + $checksumPath
          gh release upload $env:GITHUB_REF_NAME @uploadPaths --clobber
